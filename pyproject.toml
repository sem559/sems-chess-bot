[project]
name = "sems-chess-bot"
version = "0.1.0"
description = "Stockfish-powered chess bot with playstyles, opening repertoires, ELO scaling, a web GUI and a Lichess BOT runner"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "chess>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "berserk>=0.13",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.scripts]
sems-chess = "sems.web.__main__:main"
sems-lichess = "sems.lichess.runner:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sems*"]

[tool.setuptools.package-data]
sems = ["data/*.json", "web/static/*", "web/static/vendor/chessground/*", "lichess/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
